name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Runs the Makefile target so CI and a local run use the same scanner
      # version and arguments. The gosec action is not used: its latest tag
      # still runs the image of the release before.
      - name: Run gosec
        run: make gosec

  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
