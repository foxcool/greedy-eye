name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  golangci:
    name: Lint code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      - name: Check gofmt (covers build-tagged files)
        run: |
          out="$(gofmt -l .)" || exit 1
          if [ -n "$out" ]; then echo "gofmt drift (run gofmt -w):"; echo "$out"; exit 1; fi

      - name: Check build tags are linted (run.build-tags)
        run: go run ./internal/tools/tagcheck

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # Must move together with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.25'

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage-unit.out -covermode=atomic ./...

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.25'

      # Pinned to the version the release image installs: the integration suite
      # runs the migrations, so it has to run them with the engine production
      # uses, not with whatever the installer serves today.
      - name: Install Atlas CLI
        run: ATLAS_VERSION=v1.3.2 sh -c 'curl -sSf https://atlasgo.sh | sh'

      - name: Run integration tests
        run: |
          go test -v -p 1 -tags=integration ./internal/store/postgres/... -coverprofile=coverage-integration.out

  # The backend as a built binary against a freshly migrated database, driven
  # over the wire. Needs no provider keys: deploy/secrets.env is optional and
  # absent here, and a test that cannot run without a key skips.
  smoke-tests:
    name: Run smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # COMPOSE passes --env-file deploy/.env, which compose requires to exist.
      # It only carries EYE_DOMAIN for the dev stack's Traefik labels.
      - name: Run smoke tests
        run: |
          touch deploy/.env
          make test-smoke

  # The same suite against one process that calls its own domains over the
  # wire, through a proxy that checks each cross-domain hop carries the caller.
  # A separate job, so a red says which mode broke.
  smoke-loopback:
    name: Run smoke tests (loopback)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run loopback smoke tests
        run: |
          touch deploy/.env
          make test-smoke-loopback

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - golangci
      - unit-tests
      - integration-tests
      - smoke-tests
      - smoke-loopback
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '^1.25'

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
