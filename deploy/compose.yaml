# Deployment configuration for development environment
volumes:
  postgres_data: # DB data
  go_modules: # cache go modules

networks:
  proxy:
    external: true

services:
  # greedy-eye
  # Default profile for development.
  eye-dev:
    profiles: ["default", "dev"]
    build:
      context: ..
      dockerfile: build/dev.Dockerfile
      args:
        _path: cmd/eye
    container_name: eye-dev
    # Development specific configuration working with source code.
    volumes:
      # Mount source code for live reload.
      - ..:/go/src/github.com/foxcool/greedy-eye
      - go_modules:/go/pkg/mod
    working_dir: /go/src/github.com/foxcool/greedy-eye
    # Use air for running the application.
    command: ["air", "-c", ".air.toml"]
    env_file: secrets.env
    environment:
      EYE_LOGGING_LEVEL: INFO
      EYE_SENTRY_ENVIRONMENT: "development"
      EYE_DB_URL: "postgres://greedy_eye:password@postgres:5432/greedy_eye?sslmode=disable"
      # Development's share of the CoinGecko plan is NOT set here any more. The
      # plan belongs to the key, so the share that carves it up lives beside the
      # key, in the provider account's data:
      #
      #   {"provider":"coingecko","api_key":"CG-...","quota":"2000","period":"month"}
      #
      # A per-provider setting in the service's environment is what this file
      # used to carry, and it is the pattern personal-s05 exists to remove.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/eye/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # Connect-RPC / gRPC routes
      - "traefik.http.routers.eye-dev.rule=Host(`${EYE_DOMAIN}`) && PathPrefix(`/eye.v1.`)"
      - "traefik.http.routers.eye-dev.entrypoints=web,websecure"
      - "traefik.http.routers.eye-dev.tls=true"
      - "traefik.http.routers.eye-dev.priority=30"
      - "traefik.http.routers.eye-dev.middlewares=psina-auth@docker"
      # Auth middleware
      - "traefik.http.middlewares.psina-auth.forwardAuth.address=http://psina-dev:8080/verify"
      - "traefik.http.middlewares.psina-auth.forwardAuth.authRequestHeaders=Authorization,Cookie"
      - "traefik.http.middlewares.psina-auth.forwardAuth.authResponseHeaders=X-User-Id,X-User-Email,X-User-Roles"
      - "traefik.http.services.eye-dev.loadbalancer.server.port=8080"
      - "traefik.http.services.eye-dev.loadbalancer.server.scheme=h2c"
    networks:
      - proxy
      - default
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Debug profile for development.
  eye-debug:
    profiles: ["debug"]
    build:
      context: ..
      dockerfile: build/debug.Dockerfile
      args:
        _path: cmd/eye
    container_name: eye-debug
    ports:
      - "40000:40000" # Delve debugger
    volumes:
      - ..:/go/src/github.com/foxcool/greedy-eye
      - go_modules:/go/pkg/mod
    working_dir: /go/src/github.com/foxcool/greedy-eye
    env_file: secrets.env
    environment:
      EYE_LOGGING_LEVEL: DEBUG
      EYE_SENTRY_ENVIRONMENT: "debug"
      EYE_DB_URL: "postgres://greedy_eye:password@postgres:5432/greedy_eye?sslmode=disable"
    labels:
      - "traefik.enable=true"
      # Connect-RPC / gRPC routes
      - "traefik.http.routers.eye-debug.rule=Host(`${EYE_DOMAIN}`) && PathPrefix(`/eye.v1.`)"
      - "traefik.http.routers.eye-debug.entrypoints=web,websecure"
      - "traefik.http.routers.eye-debug.tls=true"
      - "traefik.http.routers.eye-debug.priority=30"
      - "traefik.http.routers.eye-debug.middlewares=psina-auth@docker"
      # Auth middleware
      - "traefik.http.middlewares.psina-auth.forwardAuth.address=http://psina-dev:8080/verify"
      - "traefik.http.middlewares.psina-auth.forwardAuth.authRequestHeaders=Authorization,Cookie"
      - "traefik.http.middlewares.psina-auth.forwardAuth.authResponseHeaders=X-User-Id,X-User-Email,X-User-Roles"
      - "traefik.http.services.eye-debug.loadbalancer.server.port=8080"
      - "traefik.http.services.eye-debug.loadbalancer.server.scheme=h2c"
    networks:
      - proxy
      - default
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Database needed by the eye application for storing data
  # Also hosts atlas_dev database used by Atlas for schema diffing (created via healthcheck)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: greedy_eye
      POSTGRES_PASSWORD: password
      POSTGRES_DB: greedy_eye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greedy_eye -d greedy_eye && (psql -U greedy_eye -d atlas_dev -c 'SELECT 1' > /dev/null 2>&1 || psql -U greedy_eye -c 'CREATE DATABASE atlas_dev WITH OWNER greedy_eye')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs pending versioned migrations before the app starts.
  #
  # This used to be `schema apply`, which diffs the declarative schema.hcl
  # against whatever the database currently holds and applies the difference
  # in both directions — so bringing the stack up from a branch that predates
  # a column DROPPED it, data and all. `migrate apply` only ever runs the
  # files in migrations/ that this database has not run yet.
  #
  # A database that already carries the schema (dev, prod, anything created
  # before migrations existed) has to be baselined once; see docs/development.md.
  migrate:
    profiles: ["default", "dev", "test"]
    # Pinned to the version the release image installs, so dev runs the deploy's
    # migration engine rather than whatever :latest became overnight.
    image: arigaio/atlas:1.3.2
    volumes:
      - ../schema.hcl:/schema.hcl:ro
      - ../migrations:/migrations
    command: >
      migrate apply
      --url "postgres://greedy_eye:password@postgres:5432/greedy_eye?sslmode=disable"
      --dir "file:///migrations"
      --revisions-schema atlas
    depends_on:
      postgres:
        condition: service_healthy

  # Atlas CLI for database migration
  atlas-cli:
    profiles: ["tools"]
    image: arigaio/atlas
    stdin_open: true
    tty: true
    volumes:
      - ../:/greedy-eye/
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EYE_DB_URL: "postgres://greedy_eye:password@postgres:5432/greedy_eye?sslmode=disable"

  # Service for running tests in isolation
  eye-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: build/dev.Dockerfile
      args:
        _path: cmd/eye
    container_name: eye-test
    volumes:
      - ..:/go/src/github.com/foxcool/greedy-eye
      - go_modules:/go/pkg/mod
    working_dir: /go/src/github.com/foxcool/greedy-eye
    env_file: secrets.env
    environment:
      EYE_DB_URL: "postgres://greedy_eye:password@postgres:5432/greedy_eye?sslmode=disable"
      SMOKE_BACKEND_URL: "http://eye-dev:8080"
    depends_on:
      eye-dev:
        condition: service_healthy
