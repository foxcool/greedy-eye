---
- name: Stop and remove containers
  ansible.builtin.command:
    cmd: docker compose down {{ '--volumes' if greedy_eye_remove_volumes | default(true) | bool else '' }}
    chdir: "{{ greedy_eye_app_dir }}"
  become: true
  when:
    - not ansible_check_mode
    - (greedy_eye_app_dir + '/docker-compose.yml') is file
  changed_when: true

- name: Remove application directory
  ansible.builtin.file:
    path: "{{ greedy_eye_app_dir }}"
    state: absent
  when:
    - greedy_eye_remove_volumes | default(true) | bool
    - not ansible_check_mode
  become: true
