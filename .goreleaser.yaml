project_name: greedy-eye

before:
  hooks:
    - go mod tidy

builds:
  - id: eye
    main: ./cmd/eye
    binary: eye
    env:
      - CGO_ENABLED=0
    # Stamp the tag into the binary so a running instance can say which build it
    # is, on /eye/health and on its startup line. Without this the variable
    # keeps its "dev" default, which is the honest answer for a local build and
    # a lie for a release — hence the explicit flag rather than trusting a
    # default. Overrides GoReleaser's default ldflags, which set main.version
    # among others; -s -w are carried over from it to keep the binary stripped.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

dockers:
  - id: eye-linux-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-amd64"
    dockerfile: build/release.Dockerfile
    extra_files:
      - schema.hcl
      - atlas.hcl

  - id: eye-linux-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-arm64"
    dockerfile: build/release.Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    extra_files:
      - schema.hcl
      - atlas.hcl

docker_manifests:
  - name_template: "ghcr.io/foxcool/greedy-eye:{{ .Version }}"
    image_templates:
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-amd64"
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-arm64"

  - name_template: "ghcr.io/foxcool/greedy-eye:latest"
    image_templates:
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-amd64"
      - "ghcr.io/foxcool/greedy-eye:{{ .Version }}-arm64"
