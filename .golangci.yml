            - pkg: github.com/foxcool/greedy-eye/internal/service/credentials
              desc: "service-no-cross-import: internal/service/settings must not import internal/service/credentials; use a consumer-defined client interface or add a reasoned exception in .golangci.yml"
            - pkg: github.com/foxcool/greedy-eye/internal/service/marketdata
              desc: "service-no-cross-import: internal/service/settings must not import internal/service/marketdata; use a consumer-defined client interface or add a reasoned exception in .golangci.yml"
            - pkg: github.com/foxcool/greedy-eye/internal/service/portfolio
