            - pkg: github.com/foxcool/greedy-eye/internal/service/settings
              desc: "service-no-cross-import: internal/service/marketdata must not import internal/service/settings; use a consumer-defined client interface or add a reasoned exception in .golangci.yml"
            - pkg: github.com/foxcool/greedy-eye/internal/service/user
              desc: "service-no-cross-import: internal/service/marketdata must not import internal/service/user; use a consumer-defined client interface or add a reasoned exception in .golangci.yml"

        service-no-cross-import-portfolio:
          files:
            - "**/internal/service/portfolio/**"
            - "!$test"
          deny:
            - pkg: github.com/foxcool/greedy-eye/internal/service/analytics
