syntax = "proto3";

package eye.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";
import "v1/marketdata.proto";

option go_package = "github.com/foxcool/greedy-eye/api/v1;apiv1";

// =============================================================================
// TYPES
// =============================================================================

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_WALLET = 1;
  ACCOUNT_TYPE_EXCHANGE = 2;
  ACCOUNT_TYPE_BANK = 3;
  ACCOUNT_TYPE_BROKER = 4;
  // Pure data-provider API key (Moralis, Etherscan, ...); no holdings of its own.
  ACCOUNT_TYPE_SERVICE = 5;
  // No connector or credentials; positions are entered by hand or imported.
  ACCOUNT_TYPE_MANUAL = 6;
}

// ProvenanceSource records how a holding entered the system.
enum ProvenanceSource {
  PROVENANCE_SOURCE_UNSPECIFIED = 0;
  PROVENANCE_SOURCE_SYNC = 1;       // Created by an automatic account sync
  PROVENANCE_SOURCE_MANUAL = 2;     // Entered by hand via CRUD API
  PROVENANCE_SOURCE_LLM_IMPORT = 3; // Created by a batch import (LLM-parsed export)
}

// LedgerEventKind is what happened to an account. The legs say which assets
// moved and how; the kind says why.
enum LedgerEventKind {
  LEDGER_EVENT_KIND_UNSPECIFIED = 0;
  LEDGER_EVENT_KIND_TRADE = 1;        // One asset exchanged for another on the account
  LEDGER_EVENT_KIND_TRANSFER_IN = 2;  // Received from another account of the same owner
  LEDGER_EVENT_KIND_TRANSFER_OUT = 3; // Sent to another account of the same owner
  LEDGER_EVENT_KIND_DEPOSIT = 4;      // Entered from outside the owner's accounts
  LEDGER_EVENT_KIND_WITHDRAWAL = 5;   // Left the owner's accounts
  LEDGER_EVENT_KIND_INCOME = 6;       // Earned: interest, staking reward, dividend
  LEDGER_EVENT_KIND_FEE = 7;          // A charge that is not part of another event
  LEDGER_EVENT_KIND_OPENING = 8;      // A balance the ledger starts from
}

// IncomeKind is what an income event paid. Set on an income event and only
// there. A tax withheld on a payment is an income event of the same kind with
// an out leg.
enum IncomeKind {
  INCOME_KIND_UNSPECIFIED = 0;
  INCOME_KIND_COUPON = 1;
  INCOME_KIND_DIVIDEND = 2;
  INCOME_KIND_INTEREST = 3;
  INCOME_KIND_STAKING_REWARD = 4;
  INCOME_KIND_OTHER = 5;
  // A tax the source names no income for (a broker's annual withholding and
  // its corrections). An out leg is withheld, an in leg refunded.
  INCOME_KIND_TAX = 6;
}

enum LedgerLegDirection {
  LEDGER_LEG_DIRECTION_UNSPECIFIED = 0;
  LEDGER_LEG_DIRECTION_IN = 1;  // The account received the amount
  LEDGER_LEG_DIRECTION_OUT = 2; // The account gave the amount up
}

enum LedgerLegRole {
  LEDGER_LEG_ROLE_UNSPECIFIED = 0;
  LEDGER_LEG_ROLE_PRINCIPAL = 1; // The asset the event is about (the base of a trade)
  LEDGER_LEG_ROLE_COUNTER = 2;   // What was paid or received for the principal
  LEDGER_LEG_ROLE_FEE = 3;
  LEDGER_LEG_ROLE_INCOME = 4;
}

// Portfolio represents a collection of holdings managed by a user.
message Portfolio {
  string id = 1;
  string user_id = 2;
  string name = 3;
  optional string description = 4;
  map<string, google.protobuf.Any> data = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // If true, the portfolio is kept out of every total that crosses portfolios
  // (the BALANCE heatmap, an "all portfolios" net worth) — a paper model is not
  // money the owner has. Asked for on its own, it still values in full. Set
  // only by the owner through UpdatePortfolio; nothing flags a portfolio
  // automatically.
  bool excluded_from_totals = 8;
}

// Holding represents a specific quantity of an Asset held within an Account.
message Holding {
  string id = 1;
  // Raw integer balance as a decimal string (scaled by `decimals`).
  // String because uint256 on-chain balances overflow int64.
  string amount = 2;
  uint32 decimals = 3;
  string asset_id = 4;
  string account_id = 5;
  optional string portfolio_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // If true, explicitly excluded from all portfolio calculations (e.g. spam/scam tokens).
  bool excluded = 9;
  // Output only. Creation provenance, stamped by the server; values sent by clients are ignored.
  ProvenanceSource source = 10;
  // Output only. Batch id linking rows created by one import; stamped by the server.
  optional string import_id = 11;
  // Network this amount sits on ("eth", "base", "solana"). Empty means the
  // position is not chain-scoped (an exchange balance, a manual entry) — it
  // never means Ethereum. Sync writes one row per (account, asset, chain), so
  // the same token held on three chains is three holdings, not one sum.
  string chain = 12;
  // How soon this amount can be spent: "liquid", "staked", "unbonding",
  // "locked", "vesting". Empty means the source could not partition the
  // balance — it is NOT a synonym for liquid, and a runway figure must not
  // read it as one. Sync writes one row per (account, asset, chain, liquidity).
  string liquidity = 13;
  // Output only. Last time a sync wrote this row; unset if none ever did.
  // A row a sync adopted keeps its original source, so this, not source,
  // says whether a provider keeps the amount current.
  optional google.protobuf.Timestamp synced_at = 14;
}

// Account represents a user's connection to an external financial entity.
message Account {
  string id = 1;
  string user_id = 2;
  string name = 3;
  optional string description = 4;
  AccountType type = 5;
  // Provider identifiers and credentials. Secret-looking keys (api_key,
  // api_secret, *_token, *_password) are write-only: responses return a
  // "••••"+last4 mask instead of the value. Sending a masked value back in
  // an update keeps the stored secret; sending a new value rotates it.
  map<string, string> data = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // If set, holdings synced from this account are assigned to this portfolio (can be overridden per holding).
  optional string portfolio_id = 9;
  // What the account credentials allow (e.g. "portfolio_sync", "trading",
  // "market_data", "onchain_lookup"). Validated against the account type.
  repeated string capabilities = 10;
  // Subset of capabilities shared system-wide for any user. Admin-managed:
  // mutations require the admin role and an explicit update_mask entry.
  repeated string system_scopes = 11;
  // The owner has stood the account down: it keeps its credential and its
  // holdings, but nothing uses it — not price or chain lookups, not the balance
  // sweep, not SyncAccount. Written through UpdateAccount with "disabled" in the
  // mask; manual accounts refuse it, having nothing external to stop. Holdings
  // stay in every total as their last snapshot and keep dating amounts_as_of.
  // Ignored on create: an account is born active. The flag belongs to this
  // account alone — broker accounts discovered from one token each carry their
  // own, so disabling the one holding the token stops discovery, not the
  // accounts it found.
  bool disabled = 12;
  // Output only. When the account was stood down; absent while it is active.
  // Disabling an already disabled account keeps the first time.
  optional google.protobuf.Timestamp disabled_at = 13;
}

// LedgerEvent is one thing that happened to an account at executed_at, with
// every asset movement it made as a leg. The source payload it was built from
// is kept server-side and not returned.
message LedgerEvent {
  string id = 1;
  string account_id = 2;
  LedgerEventKind kind = 3;
  // When the event happened, not when the row was written.
  google.protobuf.Timestamp executed_at = 4;
  // The source's own id for the event; unique per (account, source).
  optional string external_ref = 5;
  // Output only. "manual", "llm_import" or "sync:<provider>".
  string source = 6;
  // Output only. Batch id linking events created by one import.
  optional string import_id = 7;
  repeated LedgerLeg legs = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Set on an income event only. An income event written before income kinds
  // existed reads as INCOME_KIND_OTHER.
  IncomeKind income_kind = 11;
}

// LedgerLeg is one asset movement of an event. The amount is never negative;
// direction carries the sign.
message LedgerLeg {
  string id = 1;
  string asset_id = 2;
  LedgerLegDirection direction = 3;
  LedgerLegRole role = 4;
  // Raw integer amount as a decimal string, scaled by decimals (as Holding.amount).
  string amount = 5;
  uint32 decimals = 6;
  // Network the amount moved on; empty when not chain-scoped (see Holding.chain).
  string chain = 7;
}

// =============================================================================
// SERVICE
// =============================================================================

// PortfolioService manages portfolios, holdings, accounts and the ledger.
service PortfolioService {
  // --- Portfolio CRUD ---
  rpc CreatePortfolio(CreatePortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      post: "/api/v1/portfolios"
      body: "portfolio"
    };
  }

  rpc GetPortfolio(GetPortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      get: "/api/v1/portfolios/{id}"
    };
  }

  rpc UpdatePortfolio(UpdatePortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      put: "/api/v1/portfolios/{portfolio.id}"
      body: "portfolio"
    };
  }

  rpc DeletePortfolio(DeletePortfolioRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/portfolios/{id}"
    };
  }

  rpc ListPortfolios(ListPortfoliosRequest) returns (ListPortfoliosResponse) {
    option (google.api.http) = {
      get: "/api/v1/portfolios"
    };
  }

  // --- Portfolio business logic ---
  rpc CalculatePortfolioValue(CalculatePortfolioValueRequest) returns (PortfolioValueResponse) {
    option (google.api.http) = {
      post: "/api/v1/portfolios/{portfolio_id}/calculate-value"
      body: "*"
    };
  }

  // ListUnpricedHoldings walks the positions a valuation left out of the total.
  //
  // `ValuationCoverage.unpriced` is a sample: it stops at a cap while the count
  // stays exact, because that block travels in every valuation response. This
  // is the same information as a query, so the tail has somewhere to be asked
  // for. The sample belongs to the summary; the list belongs here.
  //
  // The result is computed the same way the total is, on the spot. Nothing
  // stores "unpriced" — it is what the pricing path concludes — so this cannot
  // disagree with the valuation it explains.
  rpc ListUnpricedHoldings(ListUnpricedHoldingsRequest) returns (ListUnpricedHoldingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/holdings/unpriced"
    };
  }

  rpc GetPortfolioPerformance(GetPortfolioPerformanceRequest) returns (PortfolioPerformanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/portfolios/{portfolio_id}/performance"
      body: "*"
    };
  }

  // --- Holding CRUD ---
  rpc CreateHolding(CreateHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      post: "/api/v1/holdings"
      body: "holding"
    };
  }

  rpc GetHolding(GetHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      get: "/api/v1/holdings/{id}"
    };
  }

  rpc UpdateHolding(UpdateHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      put: "/api/v1/holdings/{holding.id}"
      body: "holding"
    };
  }

  rpc DeleteHolding(DeleteHoldingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/holdings/{id}"
    };
  }

  // --- Batch import (manual accounts) ---
  // Simulation-first: call with dry_run=true to get the plan without writes,
  // confirm, then repeat with dry_run=false to commit under one import_id.
  rpc ImportPositions(ImportPositionsRequest) returns (ImportPositionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/import/positions"
      body: "*"
    };
  }

  rpc ImportTransactions(ImportTransactionsRequest) returns (ImportTransactionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/import/transactions"
      body: "*"
    };
  }

  rpc ListHoldings(ListHoldingsRequest) returns (ListHoldingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/holdings"
    };
  }

  // --- Account CRUD ---
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/api/v1/accounts"
      body: "account"
    };
  }

  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {
      get: "/api/v1/accounts/{id}"
    };
  }

  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      put: "/api/v1/accounts/{account.id}"
      body: "account"
    };
  }

  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/accounts/{id}"
    };
  }

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {
      get: "/api/v1/accounts"
    };
  }

  // ListProviders returns the external providers this build can talk to and
  // what each of them needs in accounts.data.
  //
  // Read-only and secret-free: it describes the shape of a credential, never a
  // credential. It exists so an account form stops guessing — the slugs, the
  // chains, the plans and the extra fields are the ones the resolver and the
  // rate limiter actually use, rather than a second copy that drifts.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option (google.api.http) = {
      get: "/api/v1/providers"
    };
  }

  // --- Ledger ---
  // ListLedger returns an account's ledger events with their legs, oldest
  // executed_at first. The account must be the caller's: another account
  // answers an empty page, as ListHoldings does.
  rpc ListLedger(ListLedgerRequest) returns (ListLedgerResponse) {
    option (google.api.http) = {
      get: "/api/v1/accounts/{account_id}/ledger"
    };
  }

  // GetIncomeReport sums the income events of one portfolio or one account
  // over a period: a row per month (UTC) x income kind x asset with gross, tax
  // and net, each valued in the display currency at the date of its event.
  // Income is cash flow, not wealth: it never enters a portfolio total. An
  // event with no price on its date stays out of the values and is listed as
  // unvalued. Errors:
  //   - InvalidArgument: neither or both of portfolio_id and account_id, or
  //     from is not before to.
  //   - NotFound: the portfolio or account is not the caller's.
  rpc GetIncomeReport(GetIncomeReportRequest) returns (GetIncomeReportResponse) {
    option (google.api.http) = {
      get: "/api/v1/income"
    };
  }

  // --- Account sync ---
  // SyncAccount reads a wallet, exchange or broker account from its source and
  // writes the assets and holdings it found. Errors:
  //   - InvalidArgument: account_id is empty.
  //   - NotFound / PermissionDenied: the account does not exist or is not the
  //     caller's.
  //   - FailedPrecondition: the account is disabled; enable it to sync.
  //   - Aborted: a sync of this account is already running; retry when it
  //     finishes.
  //   - Unimplemented: this instance has no account sync configured.
  rpc SyncAccount(SyncAccountRequest) returns (SyncAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/sync"
    };
  }

  // GetAccountSweepSchedule reports which accounts the balance sweep is holding
  // back, why, and until when.
  //
  // The sweep takes the two stalest accounts an hour, and staleness is read off
  // the account's own holdings — so an account whose source answers and returns
  // nothing stays the stalest and takes a slot every hour, forever. Four of them
  // did exactly that between 31.08 and 03.09.2026 and every other wallet went
  // two days without a sync while the totals showed hourly prices on two-day-old
  // quantities. Standing such an account down fixes the queue and creates a new
  // thing nobody can see, which is why this exists in the same change.
  rpc GetAccountSweepSchedule(GetAccountSweepScheduleRequest) returns (GetAccountSweepScheduleResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/sweep-schedule"
      body: "*"
    };
  }

  // ResetAccountSweepSchedule forgives the back-off accrued against accounts, so
  // they are eligible again instead of waiting out a deferral earned under
  // conditions that no longer hold.
  //
  // The same statement as its price-path twin, one entity over: a credential
  // repaired at 10:00 should not wait until 22:00 because the account spent the
  // night failing. The service cannot tell a repaired account from a broken one
  // — that is what the next sweep is for — so this withdraws the conclusion and
  // asserts nothing about whether the account will answer.
  //
  // A successful sync clears the same state on its own, including a hand-run
  // one. This RPC is for the case where an operator wants the SWEEP to try
  // again without syncing every account by hand.
  rpc ResetAccountSweepSchedule(ResetAccountSweepScheduleRequest) returns (ResetAccountSweepScheduleResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/sweep-schedule/reset"
      body: "*"
    };
  }

  // GetAccountHealth says, per account the caller owns, whether it is producing
  // anything and if not, why — and the same for every price source the
  // caller's prices depend on, including shared ones.
  //
  // Every way an account goes inert used to end in a log line: a credential the
  // resolver cannot build, a duplicate that is never asked, a plan spent or a
  // provider pausing after refusals, a chain that stopped answering, a sweep
  // that stood the account down. From outside they all looked the same: a
  // normal account and no data. Computed on read from the state the resolver,
  // the rate limiter and the sweep already keep, so it cannot go stale.
  rpc GetAccountHealth(GetAccountHealthRequest) returns (GetAccountHealthResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/health"
      body: "*"
    };
  }

  // ListUnsolicitedAssets tells identity scoring which assets nobody ever
  // bought. The answer aggregates over every holder, so only a sibling service
  // or an admin may ask.
  rpc ListUnsolicitedAssets(ListUnsolicitedAssetsRequest) returns (ListUnsolicitedAssetsResponse) {
    option (google.api.http) = {
      post: "/api/v1/holdings/unsolicited"
      body: "*"
    };
  }
}

// =============================================================================
// PORTFOLIO MESSAGES
// =============================================================================

message CreatePortfolioRequest {
  Portfolio portfolio = 1;
}

message GetPortfolioRequest {
  string id = 1;
}

message UpdatePortfolioRequest {
  Portfolio portfolio = 1;
  // Required. Names the fields to write; everything else is left alone. An
  // absent or empty mask is rejected — it used to mean "all fields", which made
  // a message carrying only an id an instruction to clear the row. Accepts
  // name, description, data, excluded_from_totals.
  google.protobuf.FieldMask update_mask = 2;
}

message DeletePortfolioRequest {
  string id = 1;
}

message ListPortfoliosRequest {
  optional string user_id = 1;
  optional int32 page_size = 2;
  optional string page_token = 3;
}

message ListPortfoliosResponse {
  repeated Portfolio portfolios = 1;
  string next_page_token = 2;
}

message CalculatePortfolioValueRequest {
  string portfolio_id = 1;
  // Quote currency: either an asset UUID or a ticker symbol (e.g. "USD"). Defaults to USD.
  string quote_asset_id = 2;
  google.protobuf.Timestamp at_time = 3;
}

message PortfolioValueResponse {
  string portfolio_id = 1;
  // Echoes the requested quote (UUID or symbol) used to value the portfolio.
  string quote_asset_id = 2;
  // Total value as a raw integer decimal string (scaled by `decimals`).
  // Excludes quarantined holdings (scam/impersonation) — see excluded_* below.
  string total_value_amount = 3;
  uint32 decimals = 4;
  google.protobuf.Timestamp calculation_time = 5;
  // Quarantined holdings kept out of the total, disclosed so the number never
  // silently diverges from the wallet: count and their summed value at the same
  // `decimals`.
  uint32 excluded_count = 6;
  string excluded_value_amount = 7;
  // Price coverage of the holdings that were not quarantined: how many entered
  // the total and which ones had no quote at all. Absence of a price is not a
  // valuation of zero, so unpriced positions are reported, never written down.
  ValuationCoverage coverage = 8;
}

message ListUnpricedHoldingsRequest {
  // Optional. Empty means every portfolio the caller owns: the cursor orders by
  // holding id across all of them, so one walk covers the whole worklist. A
  // caller wanting one portfolio's tail passes it; a foreign id is NotFound.
  optional string portfolio_id = 1;
  // Optional. Filters to one kind of gap. The kinds are different work:
  // NEVER_PRICED is bindings and markets to add, THIN_MARKET is a verdict its
  // owner has to reach. Unset returns every unpriced holding.
  optional UnpricedReason reason = 2;
  optional int32 page_size = 3;
  optional string page_token = 4;
  // Optional. Defaults to USD. A holding is unpriced relative to a quote
  // currency — there may be no path from its base to this one — so the answer
  // is only meaningful beside the quote the valuation used.
  optional string quote_asset_id = 5;
}

message ListUnpricedHoldingsResponse {
  repeated UnpricedHolding holdings = 1;
  string next_page_token = 2;
}

message ListUnsolicitedAssetsRequest {
  // At most 1000.
  repeated string asset_ids = 1;
}

message ListUnsolicitedAssetsResponse {
  // Keyed by asset id: true when every live position arrived by sync and no
  // ledger event outside a sync names the asset, false otherwise. An asset
  // nobody holds is absent.
  map<string, bool> unsolicited = 1;
}

// GetPortfolioPerformance is the price return of today's holdings since `from`:
// trades inside the range do not show. Excluded holdings are counted. Only
// direct pairs with the quote currency are used, so a holding without one drops
// out silently; one with no price since `from` counts as 0% return.
message GetPortfolioPerformanceRequest {
  string portfolio_id = 1;
  // Start of the range. Defaults to 30 days ago.
  google.protobuf.Timestamp from = 2;
  // Ignored: the range always ends now.
  google.protobuf.Timestamp to = 3;
  // Despite the name, the quote currency, not a benchmark. Defaults to the
  // display currency.
  string benchmark_asset_id = 4;
}

message PortfolioPerformanceResponse {
  string portfolio_id = 1;
  double return_percentage = 2;
  // Not computed: always 0.
  double volatility = 3;
  // Not computed: always 0.
  double sharpe_ratio = 4;
}

// =============================================================================
// HOLDING MESSAGES
// =============================================================================

message CreateHoldingRequest {
  Holding holding = 1;
}

message GetHoldingRequest {
  string id = 1;
}

message UpdateHoldingRequest {
  Holding holding = 1;
  // Required. Names the fields to write; everything else is left alone. An
  // absent or empty mask is rejected — it used to mean "all fields", so
  // toggling `excluded` alone zeroed amount and decimals and detached the
  // position from its portfolio. Accepts amount, decimals, portfolio_id,
  // excluded, chain, liquidity.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteHoldingRequest {
  string id = 1;
}

// =============================================================================
// IMPORT MESSAGES
// =============================================================================

enum ImportAction {
  IMPORT_ACTION_UNSPECIFIED = 0;
  IMPORT_ACTION_CREATE = 1;
  IMPORT_ACTION_UPDATE = 2;
  // Duplicate or no change — nothing written.
  IMPORT_ACTION_SKIP = 3;
  // Holding absent from a full-snapshot batch — closed on commit.
  IMPORT_ACTION_DELETE = 4;
}

message ImportPositionItem {
  // Symbol resolved via composite asset identity; required unless asset_id set.
  string symbol = 1;
  // Explicit asset reference; skips symbol resolution.
  optional string asset_id = 2;
  // Position size as a decimal string in asset units (e.g. "0.5").
  string amount = 3;
  // Listing market for resolution/creation; defaults by asset type.
  optional string market = 4;
  // Used when the asset has to be created; defaults to ASSET_TYPE_CRYPTOCURRENCY.
  AssetType asset_type = 5;
  // Asset name when created; defaults to the symbol.
  optional string name = 6;
  // Storage scale for the holding amount; defaults to 8.
  optional uint32 decimals = 7;
}

message ImportPositionsRequest {
  // Target account; must be of type manual.
  string account_id = 1;
  repeated ImportPositionItem positions = 2;
  // When true, returns the plan without writing anything.
  bool dry_run = 3;
  // Batch id (UUID) linking all rows of one import; generated when empty.
  optional string import_id = 4;
  // Reconcile mode: the batch is the complete position list for the account.
  // Holdings absent from it are planned as IMPORT_ACTION_DELETE and closed on
  // commit. Excluded holdings are never touched. Safety: when any batch item
  // fails, deletions are suppressed — a partially parsed export is not a
  // trustworthy snapshot.
  bool full_snapshot = 5;
}

message ImportPositionResult {
  string symbol = 1;
  // Empty in a dry run when the asset does not exist yet.
  string asset_id = 2;
  ImportAction action = 3;
  // Raw scaled amount stored (or planned), see Holding.amount.
  string amount = 4;
  uint32 decimals = 5;
  // Previous raw amount for IMPORT_ACTION_UPDATE.
  optional string previous_amount = 6;
  // The asset was (or would be) created as part of the import. The catalogue
  // is not part of the holdings transaction: an asset created for a commit
  // that rolls back stays, and this stays true.
  bool asset_created = 7;
  // Per-item failure; the rest of the batch still proceeds.
  optional string error = 8;
}

message ImportPositionsResponse {
  string import_id = 1;
  bool dry_run = 2;
  repeated ImportPositionResult items = 3;
  int32 created = 4;
  int32 updated = 5;
  int32 skipped = 6;
  int32 failed = 7;
  // Catalogue assets created by the batch, counted even when the commit rolls
  // back: those assets survive it (see asset_created).
  int32 assets_created = 8;
  // Holdings closed by a full-snapshot reconcile.
  int32 deleted = 9;
  // full_snapshot was requested but deletions were suppressed because some
  // batch items failed.
  bool deletions_suppressed = 10;
}

// ImportTransactionItem is one ledger event of an export.
message ImportTransactionItem {
  reserved 1, 2, 3, 4, 5, 6;
  reserved "type", "status", "asset_id", "symbol", "data", "external_id";

  LedgerEventKind kind = 7;
  // Required when kind is INCOME, refused otherwise.
  IncomeKind income_kind = 12;
  // Required. When the event happened.
  google.protobuf.Timestamp executed_at = 8;
  // Stable id from the source export; the dedup key when present. Without it
  // an item is a duplicate when kind, executed_at and legs all match.
  optional string external_ref = 9;
  // At least one.
  repeated ImportLedgerLeg legs = 10;
  // The row as the export had it; stored, never returned.
  map<string, string> raw = 11;
}

// ImportLedgerLeg is one asset movement of an imported event.
message ImportLedgerLeg {
  // Asset reference: an explicit id or the symbol of an existing asset.
  // Import never creates assets from ledger events.
  optional string asset_id = 1;
  optional string symbol = 2;
  LedgerLegDirection direction = 3;
  LedgerLegRole role = 4;
  // Positive human-readable decimal, e.g. "0.0025".
  string amount = 5;
  // Storage scale for the amount; defaults to 8.
  optional uint32 decimals = 6;
  optional string chain = 7;
}

message ImportTransactionsRequest {
  // Target account; must be the caller's. A manual account takes every kind.
  // Any other account takes income only, and refuses per item the income
  // kinds its own sync writes, so one payment cannot be recorded twice.
  string account_id = 1;
  repeated ImportTransactionItem transactions = 2;
  bool dry_run = 3;
  optional string import_id = 4;
}

message ImportTransactionResult {
  reserved 3;
  reserved "transaction_id";

  // Index into the request batch.
  int32 index = 1;
  ImportAction action = 2;
  // The ledger event created; set when committed.
  optional string event_id = 5;
  optional string error = 4;
}

message ImportTransactionsResponse {
  string import_id = 1;
  bool dry_run = 2;
  repeated ImportTransactionResult items = 3;
  int32 created = 4;
  int32 skipped = 5;
  int32 failed = 6;
}

message ListHoldingsRequest {
  optional string portfolio_id = 1;
  optional string account_id = 2;
  optional string asset_id = 3;
  optional int32 page_size = 4;
  optional string page_token = 5;
  // If true, leaves out holdings whose portfolio (own or inherited from the
  // account) is excluded_from_totals. For readers that sum across portfolios;
  // holdings outside any portfolio are kept.
  bool omit_excluded_from_totals = 6;
}

message ListHoldingsResponse {
  repeated Holding holdings = 1;
  string next_page_token = 2;
}

// =============================================================================
// ACCOUNT MESSAGES
// =============================================================================

message CreateAccountRequest {
  Account account = 1;
}

message GetAccountRequest {
  string id = 1;
}

message UpdateAccountRequest {
  Account account = 1;
  // Required. Names the fields to write; everything else is left alone. An
  // absent or empty mask is rejected — it used to mean "all fields", which made
  // a message carrying only an id an instruction to clear the row. Accepts
  // name, description, type, data, capabilities, system_scopes, portfolio_id,
  // disabled; system_scopes additionally requires the admin role. Changing
  // disabled also clears the balance sweep's deferral of the account.
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteAccountRequest {
  string id = 1;

  // Delete the account's holdings along with it. Off by default: for a manual
  // account the holdings ARE the data — nothing re-creates them — so removing
  // them has to be asked for explicitly.
  //
  // Ledger history is never deleted this way. If the account has ledger
  // events the request is refused regardless of this flag: positions are a
  // snapshot, the ledger is the record of what happened.
  bool cascade = 2;
}

message ListAccountsRequest {
  optional string user_id = 1;
  optional AccountType type = 2;
  optional int32 page_size = 3;
  optional string page_token = 4;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
}

// ProviderKind is a service a provider performs. A provider may do several:
// Binance both syncs an exchange account and quotes prices.
enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_PRICE = 1;
  PROVIDER_KIND_WALLET = 2;
  PROVIDER_KIND_EXCHANGE = 3;
}

// Provider describes an external service an account can be created against.
// Everything here is a statement about what the provider needs; nothing here is
// a credential.
message Provider {
  // Slug is the value of accounts.data["provider"] — the identity the resolver
  // routes on.
  string slug = 1;
  // Human-readable name.
  string title = 2;
  repeated ProviderKind kinds = 3;
  // Capabilities an account must carry for this provider to be reachable.
  // Derived from kinds, so a form does not have to know the mapping.
  repeated string capabilities = 4;
  bool needs_api_key = 5;
  // Exchange APIs sign requests; read-only price feeds do not.
  bool needs_api_secret = 6;
  // Keyless providers answer with no account at all and are registered by
  // default. An account naming the slug still wins — that is how a free feed
  // gets throttled, or given a smaller share of a shared plan.
  bool keyless = 7;
  // Chains a wallet provider reads. Empty for everything else.
  repeated string chains = 8;
  // Extra accounts.data entries beyond api_key/api_secret.
  repeated ProviderField fields = 9;
  // Plans the provider is metered under, free keyed plan first.
  repeated ProviderTier tiers = 10;
}

// ProviderField is an accounts.data entry a provider needs beyond the usual key
// and secret — a trust anchor, for instance, which no key field can hold.
message ProviderField {
  string key = 1;
  string title = 2;
  // What happens without it, in one sentence.
  string help = 3;
  bool required = 4;
  // Asks for a textarea rather than an input: a PEM block is not a line.
  bool multiline = 5;
}

// ProviderTier is a plan the provider meters a credential under, with the
// limits this instance applies by default. The name is what goes into
// accounts.data["tier"]; an empty name is the provider's free keyed plan.
message ProviderTier {
  string name = 1;
  // Steady-state requests per second. Fractional values are meaningful.
  double rps = 2;
  // How many requests may go out back-to-back before pacing applies.
  int32 burst = 3;
  // Requests the plan allows per period. Zero means the provider meters only
  // rate, which is usual for keyless tiers.
  int32 quota = 4;
  // Window the quota resets on: "day", "month", or empty when unmetered.
  string quota_period = 5;
}

// =============================================================================
// LEDGER MESSAGES
// =============================================================================

message ListLedgerRequest {
  // Required.
  string account_id = 1;
  // Only events with a leg in this asset; such an event comes with all its legs.
  optional string asset_id = 2;
  // executed_at range, from inclusive, to exclusive.
  optional google.protobuf.Timestamp executed_from = 3;
  optional google.protobuf.Timestamp executed_to = 4;
  // Defaults to 20, at most 1000.
  optional int32 page_size = 5;
  optional string page_token = 6;
}

message ListLedgerResponse {
  repeated LedgerEvent events = 1;
  string next_page_token = 2;
}

message GetIncomeReportRequest {
  // Exactly one of portfolio_id and account_id.
  optional string portfolio_id = 1;
  optional string account_id = 2;
  // Required. executed_at range, from inclusive, to exclusive.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // Display currency (UUID or symbol). Defaults to the instance's quote asset.
  optional string quote_asset_id = 5;
}

// IncomeReportRow is one month x income kind x asset. Amounts are raw integer
// decimal strings scaled by `decimals`, values by `value_decimals` of the
// response. net = gross - tax. On an INCOME_KIND_TAX row gross is zero and a
// refund lowers tax, which is negative when refunds outweigh withholdings.
message IncomeReportRow {
  // First day of the month, UTC.
  google.protobuf.Timestamp month = 1;
  IncomeKind income_kind = 2;
  string asset_id = 3;
  string symbol = 4;
  string gross_amount = 5;
  string tax_amount = 6;
  string net_amount = 7;
  uint32 decimals = 8;
  // Values of the events in this row that had a price on their date; an
  // unvalued event adds to the amounts and not here.
  string gross_value = 9;
  string tax_value = 10;
  string net_value = 11;
  // Events of the row that carry no value.
  int32 unvalued_events = 12;
}

// UnvaluedIncome is an income event with no price on its date.
message UnvaluedIncome {
  string event_id = 1;
  google.protobuf.Timestamp executed_at = 2;
  string asset_id = 3;
  string symbol = 4;
}

message GetIncomeReportResponse {
  string quote_asset_id = 1;
  uint32 value_decimals = 2;
  repeated IncomeReportRow rows = 3;
  // Sums of the rows' values.
  string gross_value = 4;
  string tax_value = 5;
  string net_value = 6;
  repeated UnvaluedIncome unvalued = 7;
}

// SYNC ACCOUNT MESSAGES
// =============================================================================

message SyncAccountRequest {
  string account_id = 1;
  // Start reading the wallet's transfer history into the ledger from its first
  // block, on every chain it holds a position on and whose history is not read
  // yet. A long history is finished by the syncs that follow; each of them
  // continues where the last stopped.
  //
  // On a broker account: read its whole income history again rather than
  // from where the last read ended, so operations a newer build reads are
  // picked up from the past. What is recorded already is not written twice.
  // Wallet and broker accounts only.
  bool backfill_ledger = 2;
}

message SyncAccountResponse {
  string account_id = 1;
  int32 assets_upserted = 2;
  int32 holdings_upserted = 3;
  repeated string errors = 4;
  // Positions the provider no longer reports, set to zero by this sync: sold,
  // moved out, or newly rejected by a filter. Removal only happens on a
  // complete snapshot; when it is skipped, the reason is in errors.
  int32 holdings_zeroed = 5;
  // Positions the source returned and this sync could not turn into a holding:
  // an instrument its catalogue does not carry, a venue this system has no
  // market for, or a row whose quantity could not be read. A count rather than
  // a list because the positions themselves are reachable from the source; the
  // point is that a sum never reports itself whole while something is missing
  // from it. Zero means the response was understood in full.
  int32 positions_skipped = 6;
  // Assets created on a market that was inferred rather than read: the source
  // named an instrument its own catalogue does not carry, so the venue came
  // from the board the position was reported on or from the row's currency.
  // These positions ARE written; the count exists so the guess is never silent
  // and can be repaired.
  int32 assets_defaulted_market = 7;
  // Accounts this sync created because a source turned out to hold several and
  // the caller named none of them: one broker token reaches several accounts,
  // and each is its own account here so that a transfer between them stays
  // visible. Creating them is reported rather than done quietly — an account
  // appearing in somebody's list with no record of who made it is its own kind
  // of silence.
  int32 accounts_created = 8;
  // Ledger events this sync wrote from the account's history: a wallet's
  // transfers, a broker's income and the taxes on it.
  int32 ledger_events_created = 9;
  // History this sync could not bring up to date (a wallet's chains, a
  // broker's income), and movements it could not record. Kept apart from
  // errors: the balances above are complete without the history.
  repeated string ledger_errors = 10;
}

message GetAccountSweepScheduleRequest {
  // Limit the answer to one account. Absent means every account the caller owns
  // that the sweep can reach.
  optional string account_id = 1;
}

message GetAccountSweepScheduleResponse {
  repeated AccountSweepEntry accounts = 1;
  // Accounts the sweep would refresh if nothing were holding them back: stale
  // past the freshness window and not deferred. Reported separately from the
  // list because the list is about accounts in trouble, and this number is
  // about the queue behind them — a sweep that takes two an hour with twelve
  // waiting is a different instance from one with two waiting.
  uint32 due_now = 2;
}

// AccountSweepEntry is one account's standing with the balance sweep.
message AccountSweepEntry {
  string account_id = 1;
  string account_name = 2;
  // When this account's holdings were last confirmed. Absent means never — the
  // stalest state there is, and the reason such an account is picked first.
  optional google.protobuf.Timestamp last_synced_at = 3;
  // Consecutive syncs that left the account no fresher. Zero with a deferral is
  // impossible; zero without one is the ordinary state.
  uint32 misses = 4;
  // When the sweep may consider this account again. Absent means it is not
  // deferred, which is not the same as "due now": it may simply be fresh.
  optional google.protobuf.Timestamp next_attempt_at = 5;
}

message ResetAccountSweepScheduleRequest {
  // Accounts to forgive. Required, and required to be named: an empty list is
  // rejected rather than read as "all", for the same reason the price-path twin
  // rejects it — clearing everything is a bigger statement than clearing one,
  // and no caller should get it by omission.
  repeated string account_ids = 1;
}

message ResetAccountSweepScheduleResponse {
  // Accounts whose deferral was withdrawn. An account that was not deferred
  // counts zero rather than failing: asking to forgive a debt nobody owed is
  // not an error, and the count is how the caller learns the schedule was not
  // what was wrong.
  uint32 accounts_freed = 1;
}

// =============================================================================
// ACCOUNT HEALTH
// =============================================================================

// HealthState is how much of its job an account or a source is doing. The
// state of a whole is the worst state among its reasons, decided by the server
// so every client agrees on it.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  // Nothing known is wrong.
  HEALTH_STATE_OK = 1;
  // Part of it works: a chain is failing, or the sweep has stood it down.
  HEALTH_STATE_DEGRADED = 2;
  // It produces nothing until something changes.
  HEALTH_STATE_UNUSABLE = 3;
  // This instance cannot tell. Not the same as OK and must not render as it.
  HEALTH_STATE_UNKNOWN = 4;
  // Its owner stood it down on purpose. Not a fault: it ranks below OK when
  // states are combined, and no other reason is computed for it. The one
  // exception is sources_state, where a DISABLED source counts as DEGRADED.
  HEALTH_STATE_DISABLED = 5;
}

// HealthReasonKind is the shape of a problem, one repair each.
enum HealthReasonKind {
  HEALTH_REASON_KIND_UNSPECIFIED = 0;
  // The account names a provider this build has no adapter for.
  HEALTH_REASON_KIND_NO_ADAPTER = 1;
  // A client cannot be built from the account's data.
  HEALTH_REASON_KIND_CANNOT_BUILD = 2;
  // No longer reported: every account of a provider is a key tried in order,
  // and a spent one hands over to the next. Kept so the number is not reused.
  HEALTH_REASON_KIND_SHADOWED = 3;
  // The provider's plan is spent for unattended work, or it is pausing after
  // refusals. until says when it may be asked again.
  HEALTH_REASON_KIND_PROVIDER_PAUSED = 4;
  // One chain of a wallet account fails whole, sync after sync.
  HEALTH_REASON_KIND_CHAIN_FAILING = 5;
  // The balance sweep holds the account back after syncs that left it no fresher.
  HEALTH_REASON_KIND_SWEEP_DEFERRED = 6;
  // The owner disabled the account; since says when. On a source: no account
  // serves it, and at least one that could is disabled.
  HEALTH_REASON_KIND_DISABLED = 7;
  // Positions the latest sync did not confirm keep their last amount: the sync
  // withheld their removal because something it could not read may be them.
  // failures counts them; since is the oldest confirmation among them.
  HEALTH_REASON_KIND_UNCONFIRMED_POSITIONS = 8;
  // The account's stored settings cannot be read by this instance: a key it
  // was sealed with is gone, or a value is corrupt. Nothing syncs it or takes
  // it as a provider; the message names the class, never the content.
  HEALTH_REASON_KIND_UNREADABLE = 9;
  // The account's history at a source (a broker's income) was not read on
  // the latest sync; the ledger may lack what happened since. since is the
  // last time it was read in full, absent when it never was.
  HEALTH_REASON_KIND_LEDGER_FAILING = 10;
}

// HealthReason is one thing wrong, as a phrase the server wrote and the fields
// the phrase was built from.
message HealthReason {
  HealthReasonKind kind = 1;
  // Safe to show anyone who may see the account or source. Never carries
  // upstream error text.
  string message = 2;
  // The chain that fails, for CHAIN_FAILING.
  optional string chain = 3;
  // Consecutive failures: failed syncs of a chain, or syncs that left an
  // account no fresher.
  uint32 failures = 4;
  // When the run of failures began.
  optional google.protobuf.Timestamp since = 5;
  // When the account or source will be tried again.
  optional google.protobuf.Timestamp until = 6;
  // Upstream error text as received. Returned to admins only: it is somebody
  // else's words, and may describe somebody else's credential.
  optional string detail = 7;
}

// AccountHealth is one of the caller's accounts.
message AccountHealth {
  string account_id = 1;
  string account_name = 2;
  HealthState state = 3;
  repeated HealthReason reasons = 4;
}

// SourceHealth is one price source the caller's prices depend on, named by
// provider slug only: a shared source is served by an account the caller may
// not own, and nothing here says which.
message SourceHealth {
  string provider = 1;
  HealthState state = 2;
  repeated HealthReason reasons = 3;
}

message GetAccountHealthRequest {
  // Limit the accounts to one. Sources are reported in full either way: they
  // are what the account's prices depend on.
  optional string account_id = 1;
}

message GetAccountHealthResponse {
  repeated AccountHealth accounts = 1;
  // Empty with sources_state UNKNOWN when this instance does not resolve
  // price sources in-process.
  repeated SourceHealth sources = 2;
  // The worst state among sources, or UNKNOWN when they could not be read.
  // A DISABLED source counts as DEGRADED here: what only it priced is
  // unpriced, whoever chose that.
  HealthState sources_state = 3;
}
