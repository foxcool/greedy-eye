syntax = "proto3";

package eye.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";
import "v1/marketdata.proto";

option go_package = "github.com/foxcool/greedy-eye/api/v1;apiv1";

// =============================================================================
// TYPES
// =============================================================================

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_WALLET = 1;
  ACCOUNT_TYPE_EXCHANGE = 2;
  ACCOUNT_TYPE_BANK = 3;
  ACCOUNT_TYPE_BROKER = 4;
  // Pure data-provider API key (Moralis, Etherscan, ...); no holdings of its own.
  ACCOUNT_TYPE_SERVICE = 5;
  // No connector or credentials; positions are entered by hand or imported.
  ACCOUNT_TYPE_MANUAL = 6;
}

// ProvenanceSource records how a holding or transaction entered the system.
enum ProvenanceSource {
  PROVENANCE_SOURCE_UNSPECIFIED = 0;
  PROVENANCE_SOURCE_SYNC = 1;       // Created by an automatic account sync
  PROVENANCE_SOURCE_MANUAL = 2;     // Entered by hand via CRUD API
  PROVENANCE_SOURCE_LLM_IMPORT = 3; // Created by a batch import (LLM-parsed export)
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_EXTENDED = 1;   // Complex transactions: DeFi, NFT, Governance, Gaming, etc.
  TRANSACTION_TYPE_TRADE = 2;      // Exchanging one asset for another
  TRANSACTION_TYPE_TRANSFER = 3;   // Transferring asset between accounts
  TRANSACTION_TYPE_DEPOSIT = 4;    // Depositing asset into an account
  TRANSACTION_TYPE_WITHDRAWAL = 5; // Withdrawing asset from an account
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_PROCESSING = 2;
  TRANSACTION_STATUS_COMPLETED = 3;
  TRANSACTION_STATUS_FAILED = 4;
  TRANSACTION_STATUS_CANCELLED = 5;
}

// Portfolio represents a collection of holdings managed by a user.
message Portfolio {
  string id = 1;
  string user_id = 2;
  string name = 3;
  optional string description = 4;
  map<string, google.protobuf.Any> data = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Holding represents a specific quantity of an Asset held within an Account.
message Holding {
  string id = 1;
  // Raw integer balance as a decimal string (scaled by `decimals`).
  // String because uint256 on-chain balances overflow int64.
  string amount = 2;
  uint32 decimals = 3;
  string asset_id = 4;
  string account_id = 5;
  optional string portfolio_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // If true, explicitly excluded from all portfolio calculations (e.g. spam/scam tokens).
  bool excluded = 9;
  // Output only. Creation provenance, stamped by the server; values sent by clients are ignored.
  ProvenanceSource source = 10;
  // Output only. Batch id linking rows created by one import; stamped by the server.
  optional string import_id = 11;
}

// Account represents a user's connection to an external financial entity.
message Account {
  string id = 1;
  string user_id = 2;
  string name = 3;
  optional string description = 4;
  AccountType type = 5;
  // Provider identifiers and credentials. Secret-looking keys (api_key,
  // api_secret, *_token, *_password) are write-only: responses return a
  // "••••"+last4 mask instead of the value. Sending a masked value back in
  // an update keeps the stored secret; sending a new value rotates it.
  map<string, string> data = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // If set, holdings synced from this account are assigned to this portfolio (can be overridden per holding).
  optional string portfolio_id = 9;
  // What the account credentials allow (e.g. "portfolio_sync", "trading",
  // "market_data", "onchain_lookup"). Validated against the account type.
  repeated string capabilities = 10;
  // Subset of capabilities shared system-wide for any user. Admin-managed:
  // mutations require the admin role and an explicit update_mask entry.
  repeated string system_scopes = 11;
}

// Transaction represents a financial event involving assets, accounts, and portfolios.
message Transaction {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  TransactionType type = 4;
  TransactionStatus status = 5;
  string account_id = 6;
  map<string, string> data = 7;
  // Output only. Creation provenance, stamped by the server; values sent by clients are ignored.
  ProvenanceSource source = 8;
  // Output only. Batch id linking rows created by one import; stamped by the server.
  optional string import_id = 9;
}

// =============================================================================
// SERVICE
// =============================================================================

// PortfolioService manages portfolios, holdings, accounts and transactions.
service PortfolioService {
  // --- Portfolio CRUD ---
  rpc CreatePortfolio(CreatePortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      post: "/api/v1/portfolios"
      body: "portfolio"
    };
  }

  rpc GetPortfolio(GetPortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      get: "/api/v1/portfolios/{id}"
    };
  }

  rpc UpdatePortfolio(UpdatePortfolioRequest) returns (Portfolio) {
    option (google.api.http) = {
      put: "/api/v1/portfolios/{portfolio.id}"
      body: "portfolio"
    };
  }

  rpc DeletePortfolio(DeletePortfolioRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/portfolios/{id}"
    };
  }

  rpc ListPortfolios(ListPortfoliosRequest) returns (ListPortfoliosResponse) {
    option (google.api.http) = {
      get: "/api/v1/portfolios"
    };
  }

  // --- Portfolio business logic ---
  rpc CalculatePortfolioValue(CalculatePortfolioValueRequest) returns (PortfolioValueResponse) {
    option (google.api.http) = {
      post: "/api/v1/portfolios/{portfolio_id}/calculate-value"
      body: "*"
    };
  }

  rpc GetPortfolioPerformance(GetPortfolioPerformanceRequest) returns (PortfolioPerformanceResponse) {
    option (google.api.http) = {
      post: "/api/v1/portfolios/{portfolio_id}/performance"
      body: "*"
    };
  }

  // --- Holding CRUD ---
  rpc CreateHolding(CreateHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      post: "/api/v1/holdings"
      body: "holding"
    };
  }

  rpc GetHolding(GetHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      get: "/api/v1/holdings/{id}"
    };
  }

  rpc UpdateHolding(UpdateHoldingRequest) returns (Holding) {
    option (google.api.http) = {
      put: "/api/v1/holdings/{holding.id}"
      body: "holding"
    };
  }

  rpc DeleteHolding(DeleteHoldingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/holdings/{id}"
    };
  }

  // --- Batch import (manual accounts) ---
  // Simulation-first: call with dry_run=true to get the plan without writes,
  // confirm, then repeat with dry_run=false to commit under one import_id.
  rpc ImportPositions(ImportPositionsRequest) returns (ImportPositionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/import/positions"
      body: "*"
    };
  }

  rpc ImportTransactions(ImportTransactionsRequest) returns (ImportTransactionsResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/import/transactions"
      body: "*"
    };
  }

  rpc ListHoldings(ListHoldingsRequest) returns (ListHoldingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/holdings"
    };
  }

  // --- Account CRUD ---
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/api/v1/accounts"
      body: "account"
    };
  }

  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {
      get: "/api/v1/accounts/{id}"
    };
  }

  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      put: "/api/v1/accounts/{account.id}"
      body: "account"
    };
  }

  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/accounts/{id}"
    };
  }

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {
      get: "/api/v1/accounts"
    };
  }

  // --- Transaction CRUD ---
  rpc CreateTransaction(CreateTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      post: "/api/v1/transactions"
      body: "transaction"
    };
  }

  rpc GetTransaction(GetTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      get: "/api/v1/transactions/{id}"
    };
  }

  rpc UpdateTransaction(UpdateTransactionRequest) returns (Transaction) {
    option (google.api.http) = {
      put: "/api/v1/transactions/{transaction.id}"
      body: "transaction"
    };
  }

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/transactions"
    };
  }

  // --- Account sync ---
  rpc SyncAccount(SyncAccountRequest) returns (SyncAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/accounts/{account_id}/sync"
    };
  }
}

// =============================================================================
// PORTFOLIO MESSAGES
// =============================================================================

message CreatePortfolioRequest {
  Portfolio portfolio = 1;
}

message GetPortfolioRequest {
  string id = 1;
}

message UpdatePortfolioRequest {
  Portfolio portfolio = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeletePortfolioRequest {
  string id = 1;
}

message ListPortfoliosRequest {
  optional string user_id = 1;
  optional int32 page_size = 2;
  optional string page_token = 3;
}

message ListPortfoliosResponse {
  repeated Portfolio portfolios = 1;
  string next_page_token = 2;
}

message CalculatePortfolioValueRequest {
  string portfolio_id = 1;
  // Quote currency: either an asset UUID or a ticker symbol (e.g. "USD"). Defaults to USD.
  string quote_asset_id = 2;
  google.protobuf.Timestamp at_time = 3;
}

message PortfolioValueResponse {
  string portfolio_id = 1;
  // Echoes the requested quote (UUID or symbol) used to value the portfolio.
  string quote_asset_id = 2;
  // Total value as a raw integer decimal string (scaled by `decimals`).
  // Excludes quarantined holdings (scam/impersonation) — see excluded_* below.
  string total_value_amount = 3;
  uint32 decimals = 4;
  google.protobuf.Timestamp calculation_time = 5;
  // Quarantined holdings kept out of the total, disclosed so the number never
  // silently diverges from the wallet: count and their summed value at the same
  // `decimals`.
  uint32 excluded_count = 6;
  string excluded_value_amount = 7;
  // Price coverage of the holdings that were not quarantined: how many entered
  // the total and which ones had no quote at all. Absence of a price is not a
  // valuation of zero, so unpriced positions are reported, never written down.
  ValuationCoverage coverage = 8;
}

message GetPortfolioPerformanceRequest {
  string portfolio_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string benchmark_asset_id = 4;
}

message PortfolioPerformanceResponse {
  string portfolio_id = 1;
  double return_percentage = 2;
  double volatility = 3;
  double sharpe_ratio = 4;
}

// =============================================================================
// HOLDING MESSAGES
// =============================================================================

message CreateHoldingRequest {
  Holding holding = 1;
}

message GetHoldingRequest {
  string id = 1;
}

message UpdateHoldingRequest {
  Holding holding = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteHoldingRequest {
  string id = 1;
}

// =============================================================================
// IMPORT MESSAGES
// =============================================================================

enum ImportAction {
  IMPORT_ACTION_UNSPECIFIED = 0;
  IMPORT_ACTION_CREATE = 1;
  IMPORT_ACTION_UPDATE = 2;
  // Duplicate or no change — nothing written.
  IMPORT_ACTION_SKIP = 3;
  // Holding absent from a full-snapshot batch — closed on commit.
  IMPORT_ACTION_DELETE = 4;
}

message ImportPositionItem {
  // Symbol resolved via composite asset identity; required unless asset_id set.
  string symbol = 1;
  // Explicit asset reference; skips symbol resolution.
  optional string asset_id = 2;
  // Position size as a decimal string in asset units (e.g. "0.5").
  string amount = 3;
  // Listing market for resolution/creation; defaults by asset type.
  optional string market = 4;
  // Used when the asset has to be created; defaults to ASSET_TYPE_CRYPTOCURRENCY.
  AssetType asset_type = 5;
  // Asset name when created; defaults to the symbol.
  optional string name = 6;
  // Storage scale for the holding amount; defaults to 8.
  optional uint32 decimals = 7;
}

message ImportPositionsRequest {
  // Target account; must be of type manual.
  string account_id = 1;
  repeated ImportPositionItem positions = 2;
  // When true, returns the plan without writing anything.
  bool dry_run = 3;
  // Batch id (UUID) linking all rows of one import; generated when empty.
  optional string import_id = 4;
  // Reconcile mode: the batch is the complete position list for the account.
  // Holdings absent from it are planned as IMPORT_ACTION_DELETE and closed on
  // commit. Excluded holdings are never touched. Safety: when any batch item
  // fails, deletions are suppressed — a partially parsed export is not a
  // trustworthy snapshot.
  bool full_snapshot = 5;
}

message ImportPositionResult {
  string symbol = 1;
  // Empty in a dry run when the asset does not exist yet.
  string asset_id = 2;
  ImportAction action = 3;
  // Raw scaled amount stored (or planned), see Holding.amount.
  string amount = 4;
  uint32 decimals = 5;
  // Previous raw amount for IMPORT_ACTION_UPDATE.
  optional string previous_amount = 6;
  // The asset was (or would be) created as part of the import.
  bool asset_created = 7;
  // Per-item failure; the rest of the batch still proceeds.
  optional string error = 8;
}

message ImportPositionsResponse {
  string import_id = 1;
  bool dry_run = 2;
  repeated ImportPositionResult items = 3;
  int32 created = 4;
  int32 updated = 5;
  int32 skipped = 6;
  int32 failed = 7;
  int32 assets_created = 8;
  // Holdings closed by a full-snapshot reconcile.
  int32 deleted = 9;
  // full_snapshot was requested but deletions were suppressed because some
  // batch items failed.
  bool deletions_suppressed = 10;
}

message ImportTransactionItem {
  TransactionType type = 1;
  // Defaults to TRANSACTION_STATUS_COMPLETED for imported history.
  TransactionStatus status = 2;
  // Asset reference: either explicit id or symbol of an existing asset.
  // Import never creates assets from transactions.
  optional string asset_id = 3;
  optional string symbol = 4;
  // Free-form details (amount, price, date, direction, fee, ...).
  map<string, string> data = 5;
  // Stable id from the source export; primary dedup key.
  optional string external_id = 6;
}

message ImportTransactionsRequest {
  // Target account; must be of type manual.
  string account_id = 1;
  repeated ImportTransactionItem transactions = 2;
  bool dry_run = 3;
  optional string import_id = 4;
}

message ImportTransactionResult {
  // Index into the request batch.
  int32 index = 1;
  ImportAction action = 2;
  // Set when committed.
  optional string transaction_id = 3;
  optional string error = 4;
}

message ImportTransactionsResponse {
  string import_id = 1;
  bool dry_run = 2;
  repeated ImportTransactionResult items = 3;
  int32 created = 4;
  int32 skipped = 5;
  int32 failed = 6;
}

message ListHoldingsRequest {
  optional string portfolio_id = 1;
  optional string account_id = 2;
  optional string asset_id = 3;
  optional int32 page_size = 4;
  optional string page_token = 5;
}

message ListHoldingsResponse {
  repeated Holding holdings = 1;
  string next_page_token = 2;
}

// =============================================================================
// ACCOUNT MESSAGES
// =============================================================================

message CreateAccountRequest {
  Account account = 1;
}

message GetAccountRequest {
  string id = 1;
}

message UpdateAccountRequest {
  Account account = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteAccountRequest {
  string id = 1;

  // Delete the account's holdings along with it. Off by default: for a manual
  // account the holdings ARE the data — nothing re-creates them — so removing
  // them has to be asked for explicitly.
  //
  // Transaction history is never deleted this way. If the account has
  // transactions the request is refused regardless of this flag: positions are
  // a snapshot, transactions are the record of what happened.
  bool cascade = 2;
}

message ListAccountsRequest {
  optional string user_id = 1;
  optional AccountType type = 2;
  optional int32 page_size = 3;
  optional string page_token = 4;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

// =============================================================================
// TRANSACTION MESSAGES
// =============================================================================

message CreateTransactionRequest {
  Transaction transaction = 1;
}

message GetTransactionRequest {
  string id = 1;
}

message UpdateTransactionRequest {
  Transaction transaction = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message ListTransactionsRequest {
  optional TransactionType type = 1;
  optional TransactionStatus status = 2;
  optional string account_id = 3;
  optional google.protobuf.Timestamp from = 4;
  optional google.protobuf.Timestamp to = 5;
  optional int32 page_size = 6;
  optional string page_token = 7;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}

// SYNC ACCOUNT MESSAGES
// =============================================================================

message SyncAccountRequest {
  string account_id = 1;
}

message SyncAccountResponse {
  string account_id = 1;
  int32 assets_upserted = 2;
  int32 holdings_upserted = 3;
  repeated string errors = 4;
}
