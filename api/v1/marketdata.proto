syntax = "proto3";

package eye.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";

option go_package = "github.com/foxcool/greedy-eye/api/v1;apiv1";

// =============================================================================
// TYPES
// =============================================================================

enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  ASSET_TYPE_CRYPTOCURRENCY = 1;
  ASSET_TYPE_STOCK = 2;
  ASSET_TYPE_BOND = 3;
  ASSET_TYPE_COMMODITY = 4;
  ASSET_TYPE_FOREX = 5;
  ASSET_TYPE_FUND = 6;
}

// Asset represents financial instrument (crypto, stock, etc.).
// Asset identity is the composite (symbol, market, type): the same ticker may
// exist on different markets (AAPL on nasdaq vs an AAPL token on crypto).
message Asset {
  string id = 1;
  string name = 2;
  AssetType type = 3;
  optional string symbol = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Listing market/venue ("crypto" is the single global crypto market,
  // "nasdaq", "moex", "spbex"), not the price source. Defaults by type on create:
  // cryptocurrency -> "crypto", forex -> "forex"; required otherwise.
  optional string market = 8;
  // Quote currency/base where applicable.
  optional string quote = 9;
  // Identity axis (scam-filtering): whether the asset is what it claims to be.
  // "unknown" | "legit" | "suspect" | "scam" | "impersonation". Output-only;
  // set by the scoring pass or by a user verdict (SetAssetVerdict).
  optional string identity_verdict = 10;
  // Provenance of the verdict: "heuristic" | "provider:<name>" | "curated" |
  // "user:<id>". A user verdict is terminal — rescoring never overwrites it.
  optional string verdict_source = 11;
  // The last automated score in [0,1]; absent for a user verdict and for an
  // asset that has never been scored. Output-only.
  optional double identity_score = 12;
  // Which signals fired and what each weighed, so a verdict can be explained
  // rather than only announced. Empty until first scored. Output-only.
  map<string, double> identity_signals = 13;
  // When the current verdict was set. Output-only.
  optional google.protobuf.Timestamp verdict_set_at = 14;
  // The asset's identities in external namespaces.
  //
  // POPULATED BY GetAsset ONLY. proto3 cannot tell an empty list from an absent
  // one, and loading refs for every row of ListAssets would make the catalogue
  // response grow with a fact almost no caller of it wants. Read an empty list
  // from any other RPC as "not loaded", never as "this asset has none".
  repeated AssetExternalRef external_refs = 15;
  // Situational risk flags on the asset (risk-model axis 2).
  //
  // POPULATED BY GetAsset ONLY, same rule and same reason as external_refs
  // above: an empty list from any other RPC means "not loaded", never "this
  // asset carries no risk".
  //
  // A flag never changes a total. See AssetRiskFlag.
  repeated AssetRiskFlag risk_flags = 16;
}

// AssetRiskFlag records a situational risk on an asset whose identity is not in
// question (risk-model axis 2): an exploited protocol, a depegged stablecoin,
// frozen transfers, a deprecation, a delisting, a sanctions freeze.
//
// IT DOES NOT TOUCH THE SUM. It does not derive holdings.excluded and it does
// not enter ValuationCoverage. Axis 2 works on top of real money: the asset is
// real, the value is real, only its fate is in question. This is the whole
// difference from an identity verdict, which says the asset is not what it
// claims and therefore must leave the total. The two will sit next to each
// other on the asset card, and unifying them is the most likely future
// regression — a flag that subtracts would let "this may go badly" masquerade
// as "this is not real", and the person reading the total could not tell which
// statement they were being shown.
//
// review_at is required, not decorative: a temporary flag with no review date
// hangs forever and devalues every other flag on the axis.
message AssetRiskFlag {
  string id = 1;
  string asset_id = 2;
  // "exploit" | "depeg" | "frozen_transfers" | "deprecation" | "delisting" |
  // "sanctions_freeze".
  string kind = 3;
  // Free-form context: what happened, where it was reported.
  optional string note = 4;
  // Derived action direction (axis 3): "none" | "hold" | "exit_soon".
  optional string action_hint = 5;
  // When the flag must be revisited or ends. Required on write.
  google.protobuf.Timestamp review_at = 6;
  // Who set it: "user:<id>". Output-only.
  optional string set_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

// AssetExternalRef maps an asset to its identifier in an external namespace.
//
// On a chain, identity is the contract and not the symbol: this is what keeps a
// clone of a real ticker from merging into the real asset. It is also where a
// wrong binding lives — a contract bound before that rule existed still routes
// every sync to whatever it was bound to, which is why the binding has to be
// visible and removable (DeleteAssetExternalRef).
message AssetExternalRef {
  string id = 1;
  string asset_id = 2;
  // Namespace: "onchain:<chain>", "coingecko", "cmc", broker ID spaces.
  string source = 3;
  // Contract address, mint, coin id.
  string ref = 4;
  // "auto" | "manual" | "seed". A manual link is terminal for auto-discovery.
  string origin = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Price represents the price action of an Asset against a base Asset
// over a specific interval (candle/OHLCV) or as a latest snapshot.
message Price {
  string id = 1;
  string source_id = 2;     // Identifier for the source (e.g., "coingecko", "binance")
  string asset_id = 3;      // ID of the Asset whose price is represented
  string base_asset_id = 4; // ID of the Asset against which the price is quoted
  // Interval defines the time period this price data represents.
  // Examples: "1m", "5m", "1h", "4h", "1d", "tick", "latest".
  string interval = 5;
  uint32 decimals = 6;
  // Prices are raw integers scaled by `decimals`, sent as decimal strings (precision-safe).
  string last = 7;
  // OHLCV data - applicable when 'interval' represents a standard candle type.
  optional string open = 8;
  optional string high = 9;
  optional string low = 10;
  optional string close = 11;
  optional string volume = 12;
  google.protobuf.Timestamp timestamp = 13;
  // Market capitalisation observed with this quote, scaled by `decimals` like
  // the amounts above. Absent means the source reported none — which is not the
  // same statement as a capitalisation of zero. It travels with the price, not
  // with the asset: a quote is only as good as the market standing behind it.
  optional string market_cap = 14;
}

// ValuationCoverage reports how much of a computed value actually had prices
// behind it. An absent quote and a zero valuation are different statements: a
// holding with no price path stays OUT of the total and is reported here,
// instead of silently contributing nothing and making the result look complete.
//
// It lives in marketdata because it describes the price side of a valuation:
// both the portfolio total and the analytics heatmap embed the same block
// rather than each growing its own coverage fields.
message ValuationCoverage {
  // Holdings that entered the total.
  uint32 priced_count = 1;
  // Holdings left out of the total: no price path exists, or the quote found had
  // no market behind it. `UnpricedReason` on each entry says which.
  uint32 unpriced_count = 2;
  // Identifies the unpriced holdings, capped for read size.
  repeated UnpricedHolding unpriced = 3;
  // True when unpriced_count exceeds the cap and `unpriced` lists only a prefix.
  bool unpriced_truncated = 4;
  // When the amounts behind this result were last confirmed by a sync: the
  // oldest update time among the SYNCED holdings that entered it.
  //
  // A price and an amount go stale independently, and only the price has a
  // sweep watching it. Re-pricing week-old quantities produces a total that
  // moves every hour and stays wrong — a number that moves reads as a number
  // that is current.
  //
  // Hand-entered and imported holdings are deliberately not counted here. No
  // provider will ever refresh them, so one forgotten manual row would pin this
  // date permanently and the field would report nothing about the sweep it
  // exists to watch. Their age is disclosed where it can be acted on: per row,
  // as `Holding.updated_at` beside `Holding.source`.
  //
  // Unset when nothing was counted — and also when everything counted was
  // hand-entered, which a caller can tell apart by `priced_count` being
  // non-zero. Read that as "no synced amount stands behind this total", not as
  // "the quantities are current".
  google.protobuf.Timestamp amounts_as_of = 5;
  // How many of the priced holdings were valued by a quote older than the
  // instance's freshness policy (see `valuation.v1`; the default is 48h).
  //
  // They stay IN the total on purpose. Dropping a stale quote would take the
  // position out on every provider outage and put it back on recovery, so the
  // total would move for reasons that have nothing to do with the market —
  // the very failure this block exists to prevent. Named, not removed.
  uint32 stale_count = 6;
  // The oldest quote behind this result. A total is only as current as the
  // stalest price under it, the same way `amounts_as_of` dates the quantities
  // under it. Unset when nothing was priced.
  google.protobuf.Timestamp prices_as_of = 7;
}

// UnpricedReason says why a holding stayed out of the total. The distinction is
// actionable: a missing quote is a coverage gap to close upstream, while a thin
// market is a property of the asset its owner has to make a decision about.
enum UnpricedReason {
  UNPRICED_REASON_UNSPECIFIED = 0;
  // No price row for the asset, or no path from its traded base to the quote,
  // and nothing yet says whether anyone has looked.
  UNPRICED_REASON_NO_QUOTE = 1;
  // A quote exists but the market behind it is too small to realise the position
  // at that price. See ADR-009 for the threshold and the distribution it came from.
  UNPRICED_REASON_THIN_MARKET = 2;
  // Every source that was asked has been asked repeatedly and none has ever
  // returned a price. `asked_since` says for how long.
  //
  // Read it as evidence, not as a verdict. The system knows it asked and got
  // nothing; it does NOT know the instrument was delisted, halted or withdrawn —
  // claiming that would assert a fact nothing here observed. What separates it
  // from NO_QUOTE is where the gap lives: NO_QUOTE can still be our own pipeline
  // not having reached the asset, while this one has exhausted the sources it has.
  UNPRICED_REASON_NEVER_PRICED = 3;
}

// UnpricedHolding names one position that could not be valued. There is no
// amount-in-quote field by construction: the whole point is that no quote exists.
message UnpricedHolding {
  string holding_id = 1;
  string asset_id = 2;
  // Best-effort label for display; empty when the asset lookup failed.
  string symbol = 3;
  UnpricedReason reason = 4;
  // Since when this asset has been asked about without an answer. Set only with
  // UNPRICED_REASON_NEVER_PRICED, where it turns "no price" into "no price for
  // eleven days, across four sources" — the difference between a gap someone
  // should look at and one that has already been looked at.
  google.protobuf.Timestamp asked_since = 5;
}

// AssetPricingStatus reports what asking sources for an asset's price has
// produced so far. It answers one question a valuation cannot answer on its
// own: is this asset unpriced because nothing has looked, or because everything
// that looked came back empty?
//
// Deliberately NOT fields on Asset. Asset travels through ListAssets, where
// proto3 cannot distinguish a field left unloaded from one that is genuinely
// zero — the trap already documented on Asset.external_refs. A separate message
// is unambiguous: an asset absent from the response has never been asked about.
message AssetPricingStatus {
  string asset_id = 1;
  // True when at least one source has returned a price at some point. Such an
  // asset has a price row, so a valuation that still could not use it failed
  // for another reason (no path to the quote asset, or a thin market).
  bool ever_priced = 2;
  // First and last time any source was asked about this asset.
  google.protobuf.Timestamp first_asked_at = 3;
  google.protobuf.Timestamp last_asked_at = 4;
  // How many distinct sources have been asked. Four sources silent for a week
  // is a different statement from one source silent for a week.
  uint32 sources_asked = 5;
}

// =============================================================================
// SERVICE
// =============================================================================

// MarketDataService manages assets and price data.
service MarketDataService {
  // --- Asset CRUD ---
  rpc CreateAsset(CreateAssetRequest) returns (Asset) {
    option (google.api.http) = {
      post: "/api/v1/assets"
      body: "asset"
    };
  }

  rpc GetAsset(GetAssetRequest) returns (Asset) {
    option (google.api.http) = {
      get: "/api/v1/assets/{id}"
    };
  }

  rpc UpdateAsset(UpdateAssetRequest) returns (Asset) {
    option (google.api.http) = {
      put: "/api/v1/assets/{asset.id}"
      body: "asset"
    };
  }

  rpc DeleteAsset(DeleteAssetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/assets/{id}"
    };
  }

  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (google.api.http) = {
      get: "/api/v1/assets"
    };
  }

  // --- Asset business logic ---
  rpc EnrichAssetData(EnrichAssetDataRequest) returns (Asset) {
    option (google.api.http) = {
      post: "/api/v1/assets/{asset_id}/enrich"
      body: "*"
    };
  }

  rpc FindSimilarAssets(FindSimilarAssetsRequest) returns (ListAssetsResponse) {
    option (google.api.http) = {
      get: "/api/v1/assets/{asset_id}/similar"
    };
  }

  // Find-first asset resolution by composite identity (symbol, market, type);
  // creates the asset only when nothing matches and dry_run is false.
  rpc FindOrCreateAsset(FindOrCreateAssetRequest) returns (FindOrCreateAssetResponse) {
    option (google.api.http) = {
      post: "/api/v1/assets/find-or-create"
      body: "*"
    };
  }

  // Set a human identity verdict on an asset (scam-filtering). A user verdict
  // is terminal: the automated scorer never overwrites it. Admin-only until
  // per-asset RBAC lands (personal-rme).
  rpc SetAssetVerdict(SetAssetVerdictRequest) returns (Asset) {
    option (google.api.http) = {
      post: "/api/v1/assets/{asset_id}/verdict"
      body: "*"
    };
  }

  // DeleteAssetExternalRef removes one binding between an asset and an external
  // identifier. Admin-only: a binding is catalogue identity, shared by everyone.
  //
  // Bindings are otherwise immutable on purpose — identity must be stable — so
  // this exists for the one case where the binding itself was the error: an
  // unknown contract bound to a real ticker before that was refused, which then
  // routes every later sync to the wrong asset and lends it a price it has no
  // claim to. Removing the ref lets the next sync resolve the contract on its
  // own merits and isolate it.
  rpc DeleteAssetExternalRef(DeleteAssetExternalRefRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/assets/{asset_id}/external-refs/{id}"
    };
  }

  // AddAssetRiskFlag attaches a situational risk to an asset (axis 2): exploit,
  // depeg, frozen transfers, deprecation, delisting, sanctions freeze.
  //
  // THE FLAG DOES NOT TOUCH THE SUM — it does not exclude the asset from any
  // valuation and does not appear in ValuationCoverage. It marks money that is
  // real and may need acting on, which is the opposite of an identity verdict.
  //
  // Admin-only, like a verdict: a flag is catalogue-wide, seen by every user.
  rpc AddAssetRiskFlag(AddAssetRiskFlagRequest) returns (AssetRiskFlag) {
    option (google.api.http) = {
      post: "/api/v1/assets/{asset_id}/risk-flags"
      body: "*"
    };
  }

  // DeleteAssetRiskFlag removes one flag. Admin-only. Flags are meant to be
  // removed — that is what review_at is for — so unlike a binding this carries
  // no identity consequence.
  rpc DeleteAssetRiskFlag(DeleteAssetRiskFlagRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/assets/{asset_id}/risk-flags/{id}"
    };
  }

  // --- Price CRUD ---
  rpc CreatePrice(CreatePriceRequest) returns (Price) {
    option (google.api.http) = {
      post: "/api/v1/prices"
      body: "price"
    };
  }

  rpc CreatePrices(CreatePricesRequest) returns (CreatePricesResponse) {
    option (google.api.http) = {
      post: "/api/v1/prices/bulk"
      body: "prices"
    };
  }

  rpc GetLatestPrice(GetLatestPriceRequest) returns (Price) {
    option (google.api.http) = {
      get: "/api/v1/prices/{asset_id}/{base_asset_id}/latest"
    };
  }

  rpc ListPriceHistory(ListPriceHistoryRequest) returns (ListPriceHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/prices/{asset_id}/{base_asset_id}/history"
    };
  }

  rpc ListPricesByInterval(ListPricesByIntervalRequest) returns (ListPriceHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/prices/{asset_id}/{base_asset_id}/intervals"
    };
  }

  rpc DeletePrice(DeletePriceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/prices/{id}"
    };
  }

  rpc DeletePrices(DeletePricesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/prices"
    };
  }

  // --- Price business logic ---
  rpc FetchExternalPrices(FetchExternalPricesRequest) returns (FetchExternalPricesResponse) {
    option (google.api.http) = {
      post: "/api/v1/prices/fetch-external"
      body: "*"
    };
  }

  // GetPricingStatus reports, for each asset asked about, what asking its price
  // sources has produced. Batched because its caller is a valuation disclosing a
  // set of unpriced positions, not a page rendering one asset.
  //
  // Assets never asked about are simply absent from the response: there is no
  // record to report, and inventing an empty one would read as "asked, nothing
  // came back", which is the opposite statement.
  rpc GetPricingStatus(GetPricingStatusRequest) returns (GetPricingStatusResponse) {
    option (google.api.http) = {
      post: "/api/v1/prices/status"
      body: "*"
    };
  }

  // GetSweepSchedule reports when each price source is next due to be asked.
  //
  // The sweep's own summary cannot answer this. A run that asked nobody logs
  // the same "fetched=0, stored=0" as a run with nothing to ask, so an instance
  // whose whole catalogue is deferred until next Tuesday looks identical to one
  // that is perfectly up to date. The difference lives in price_fetch_attempts,
  // which until now no RPC could read: the only way to tell the two apart was a
  // psql session on the host.
  //
  // Counted live against the attempt log rather than materialised, for the same
  // reason ListUnpricedHoldings is: a second store of what is due would be a
  // second source of truth about the schedule, free to disagree with the sweep
  // it describes.
  rpc GetSweepSchedule(GetSweepScheduleRequest) returns (GetSweepScheduleResponse) {
    option (google.api.http) = {
      post: "/api/v1/prices/schedule"
      body: "*"
    };
  }
}

// =============================================================================
// ASSET MESSAGES
// =============================================================================

message CreateAssetRequest {
  Asset asset = 1;
}

message GetAssetRequest {
  string id = 1;
}

message UpdateAssetRequest {
  Asset asset = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteAssetRequest {
  string id = 1;
}

message ListAssetsRequest {
  optional int32 page_size = 1;
  optional string page_token = 2;
  repeated string tags = 3;
  // Filter by identity verdict (scam-filtering): "unknown" | "legit" |
  // "suspect" | "scam" | "impersonation". Empty returns all. Drives the
  // Quarantine view.
  optional string identity_verdict = 4;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  string next_page_token = 2;
}

message EnrichAssetDataRequest {
  string asset_id = 1;
  repeated string sources = 2;
}

message FindSimilarAssetsRequest {
  string asset_id = 1;
  int32 limit = 2;
}

message FindOrCreateAssetRequest {
  string symbol = 1;
  // Listing market; defaults by type (cryptocurrency -> "crypto", forex ->
  // "forex"), required for other types when the asset has to be created.
  optional string market = 2;
  // Defaults to ASSET_TYPE_CRYPTOCURRENCY.
  AssetType type = 3;
  // Asset name when created; defaults to the symbol.
  optional string name = 4;
  // When true, never creates: reports what would happen instead.
  bool dry_run = 5;
  // Optional external identity for resolution and binding. When set, the asset
  // is resolved by (external_ref_source, external_ref) first — a token's
  // contract is its identity, so a scam clone of a real ticker resolves to its
  // own asset rather than merging into the real one. On a miss the mapping is
  // bound to the resolved/created asset. Source namespaces the ref:
  // "onchain:<chain>" for a contract/mint.
  optional string external_ref_source = 6;
  optional string external_ref = 7;
  // Provider identity signals for scam scoring at sync intake, where reported:
  // provider_spam is a source's own spam flag (moralis possible_spam),
  // contract_verified its contract-verification bit. Unset means "not reported"
  // (native coins, non-EVM chains) and does not influence the score.
  optional bool provider_spam = 8;
  optional bool contract_verified = 9;
}

message FindOrCreateAssetResponse {
  // Unset in a dry run that would create the asset.
  Asset asset = 1;
  // True when the asset was created (or would be, in a dry run).
  bool created = 2;
}

// DeleteAssetExternalRefRequest names both sides of the binding on purpose: the
// ref id alone would let a mistyped id detach a contract from an unrelated
// asset, and the point of this RPC is to repair identity, not to move it.
message DeleteAssetExternalRefRequest {
  string asset_id = 1;
  string id = 2;
}

message SetAssetVerdictRequest {
  string asset_id = 1;
  // "legit" | "suspect" | "scam" | "impersonation". "unknown" is not settable.
  string verdict = 2;
}

message AddAssetRiskFlagRequest {
  string asset_id = 1;
  // "exploit" | "depeg" | "frozen_transfers" | "deprecation" | "delisting" |
  // "sanctions_freeze".
  string kind = 2;
  optional string note = 3;
  // "none" | "hold" | "exit_soon". Defaults to "none".
  optional string action_hint = 4;
  // REQUIRED. A flag with no review date never expires and turns the axis into
  // noise, so there is no way to write one without saying when to look again.
  google.protobuf.Timestamp review_at = 5;
}

// DeleteAssetRiskFlagRequest names both sides for the same reason
// DeleteAssetExternalRefRequest does: an id alone lets a typo delete a flag off
// an unrelated asset, and the caller always knows which asset it is looking at.
message DeleteAssetRiskFlagRequest {
  string asset_id = 1;
  string id = 2;
}

// =============================================================================
// PRICE MESSAGES
// =============================================================================

message CreatePriceRequest {
  Price price = 1;
}

message CreatePricesRequest {
  repeated Price prices = 1;
}

message CreatePricesResponse {
  int32 created_count = 1;
}

message GetLatestPriceRequest {
  string asset_id = 1;
  string base_asset_id = 2;
  optional string source_id = 3;
}

message ListPriceHistoryRequest {
  string asset_id = 1;
  string base_asset_id = 2;
  optional google.protobuf.Timestamp from = 3;
  optional google.protobuf.Timestamp to = 4;
  optional string source_id = 5;
  optional int32 page_size = 6;
  optional string page_token = 7;
}

message ListPriceHistoryResponse {
  repeated Price prices = 1;
  string next_page_token = 2;
}

message ListPricesByIntervalRequest {
  string asset_id = 1;
  string base_asset_id = 2;
  optional google.protobuf.Timestamp from = 3;
  optional google.protobuf.Timestamp to = 4;
  string interval = 5;
  optional string source_id = 6;
  optional int32 page_size = 7;
  optional string page_token = 8;
}

message DeletePriceRequest {
  string id = 1;
}

message DeletePricesRequest {
  optional string asset_id = 1;
  optional string base_asset_id = 2;
  optional google.protobuf.Timestamp from = 3;
  optional google.protobuf.Timestamp to = 4;
  optional string source_id = 5;
}

// Naming asset_ids makes this a deliberate reconciliation: those assets are
// priced whatever their current freshness, and the per-sweep portion does not
// apply. The credential's plan quota still does — a ceiling is a ceiling.
//
// An empty request is an unattended sweep: it takes only what is due for each
// source, oldest first, within the share of the plan's remaining allowance
// that this interval affords.
message FetchExternalPricesRequest {
  // Providers to call. Empty means every configured provider.
  repeated string source_ids = 1;
  // Assets to price. Empty makes the call a budgeted sweep (see above).
  repeated string asset_ids = 2;
}

message FetchExternalPricesResponse {
  int32 prices_fetched = 1;
  int32 prices_stored = 2;
  repeated string errors = 3;
  // Sources this run selected nothing from, and why: "nothing_due",
  // "all_deferred", "budget_exhausted", "unknown".
  //
  // Without it, prices_fetched=0 is the only thing an unattended sweep can say,
  // and it means both "everything is current" and "the whole catalogue is
  // backed off until next week" — the two states an instance most needs to tell
  // apart, since one is health and the other is a week of silent staleness.
  map<string, string> idle_sources = 4;
}

message GetPricingStatusRequest {
  repeated string asset_ids = 1;
}

message GetPricingStatusResponse {
  // One entry per asset that has been asked about at least once, in no
  // particular order. Assets with no record are omitted, not zero-filled.
  repeated AssetPricingStatus statuses = 1;
}

message GetSweepScheduleRequest {
  // Optional. Empty reports every source the instance can price with, which is
  // the question an operator actually has: a single frozen source is invisible
  // when you have to name it to see it.
  optional string source_id = 1;
}

message GetSweepScheduleResponse {
  repeated SourceSchedule sources = 1;
}

// SourceSchedule is one price source's queue, as the sweep would find it now.
//
// The counts partition the assets this source is allowed to be asked about:
// due_now would be selected by the next run, deferred are held back by their
// own back-off, never_attempted have no attempt row at all. Quarantined assets
// are in none of them — the sweep never asks about those, so counting them here
// would report work nobody intends to do.
message SourceSchedule {
  string source_id = 1;
  uint32 due_now = 2;
  uint32 deferred = 3;
  uint32 never_attempted = 4;
  // When the earliest deferred asset comes due. Absent when nothing is
  // deferred, which is not the same as "due now" and must not render as one.
  optional google.protobuf.Timestamp soonest_due = 5;
  // The far end of the queue. A latest_deferred a week out is the signature of
  // assets that have hit the back-off ceiling rather than drifted toward it.
  optional google.protobuf.Timestamp latest_deferred = 6;
  // The longest consecutive-miss streak against this source. It says how deep
  // the back-off has been driven, which no timestamp shows on its own.
  uint32 max_misses = 7;
  // Why the sweep would skip this source entirely, when it would: an exhausted
  // plan, a frozen bucket. Absent means the source would be asked. This is the
  // same judgement the sweep makes, read from the same provider, not a second
  // opinion computed here.
  optional string skip_reason = 8;
}
